[project]
name = "api"
version = "0.1.0"
description = "FastAPI service for AI Stock Price Prediction Project"
authors = [
  {name = "Marcin", email = "zub@student.agh.edu.pl"},
  {name = "Modar", email = "modar@student.agh.edu.pl"},
  {name = "Tomek", email = "tomek@student.agh.edu.pl"},
]
readme = "README.md"
requires-python = "==3.13.15"
dependencies = [
  "fastapi",
  "pydantic",
  "uvicorn[standard]",
  "starlette",
  "yfinance",
  "streamlit",
  "plotly",
  "statsmodels",
  "ipykernel==7.1.0",
  "nbformat==5.10.4",
  "scikit-opt==0.6.6",
]

[dependency-groups]
dev = ["fastapi[standard]", "pytest"]

[tool.uv.dependency-groups.dev]
dependencies = [
  "pytest",
  "mypy",
  "ruff"
]

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = "tests"
pythonpath = "src"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_optional = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true


[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.coverage.report]
omit = ["api/src/asgi.py"]
